name: mylife
description: "All-in-One: Notes, Finance, Vault"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  archive: ^4.7.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1
  # New dependencies for EasyNotes features
  flutter_quill: 9.6.0        # Rich text editor (pinned for Flutter 3.19 compatibility)
  pdf: ^3.10.0                 # PDF export
  printing: ^5.11.0            # PDF preview/print
  google_fonts: ^6.1.0         # Custom fonts
  image_picker: ^1.0.7         # Add images to notes
  uuid: ^4.3.3                 # UUID generation for templates/strokes
  share_plus: ^10.0.2          # Share exported PDFs (compatible with Flutter 3.19+)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true